<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahil Mahendrakar</title>
<meta name="description" content="Sahil Mahendrakar builds things. Building in stealth, previously agentic AI at AWS.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4efe4; --ink: #1b1814; --muted: #6f675b; --rule: #ddd4c3; --accent: #8a5a3c;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 19px/1.5 "Newsreader", Georgia, serif; font-optical-sizing: auto; }
  a { color: inherit; text-decoration: none; }
  .mono { font: 400 11px/1.4 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .09em; text-transform: uppercase; }

  #scene { position: fixed; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; z-index: 0; pointer-events: none; }
  .layer { position: relative; z-index: 1; }

  /* hero: everything sits on small paper clearings cut out of the painting */
  .hero { position: relative; height: 100vh; height: 100svh; }
  .corner { position: absolute; display: flex; gap: 22px; align-items: baseline; }
  .tl { top: max(26px, env(safe-area-inset-top)); left: max(28px, env(safe-area-inset-left)); }
  .tr { top: max(26px, env(safe-area-inset-top)); right: max(28px, env(safe-area-inset-right)); }
  .bl { bottom: max(30px, env(safe-area-inset-bottom)); left: max(28px, env(safe-area-inset-left)); }
  .br { bottom: max(30px, env(safe-area-inset-bottom)); right: max(28px, env(safe-area-inset-right)); text-align: right; }
  .name { font-size: 20px; letter-spacing: -.005em; }
  nav a { font-size: 17px; color: var(--muted); transition: color .3s; }
  nav a:hover, nav a:focus-visible { color: var(--ink); }
  .line { margin: 0; font-size: clamp(22px, 2.4vw, 30px); line-height: 1.22; font-weight: 300; max-width: 15em; }
  .line em { font-style: italic; }
  .caption { all: unset; cursor: pointer; color: var(--muted); max-width: 44ch; line-height: 1.55; }
  .caption b { font-weight: 400; color: var(--ink); }
  .caption:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

  /* the paper */
  main { padding: 92vh max(24px, env(safe-area-inset-left)) 16vh; }
  .col { max-width: 640px; margin: 0 auto; }
  section + section { margin-top: 92px; }
  h2 { margin: 0 0 18px; color: var(--muted); font-weight: 400; }
  ol { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 11px 0; border-top: 1px solid var(--rule); }
  ol > li:last-child .row { border-bottom: 1px solid var(--rule); }
  .row .n { font-size: 23px; flex: none; transition: color .3s; }
  .row .d { color: var(--muted); font-size: 17px; flex: 1; min-width: 0; }
  .row .k { color: var(--muted); flex: none; }
  .row:hover .n, .row:focus-visible .n { color: var(--accent); }
  .more { display: inline-block; margin-top: 16px; color: var(--muted); font-size: 17px; }
  .more:hover { color: var(--accent); }

  /* the painting comes back at the end */
  footer { position: relative; height: 100vh; height: 100svh; }
  .links { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 18px; }
  .links a:hover { color: var(--accent); }
  .fine { color: var(--muted); }

  #peek { position: fixed; z-index: 2; pointer-events: none; width: 216px; height: 135px; image-rendering: pixelated; opacity: 0; transition: opacity .25s; }
  #peek.on { opacity: 1; }

  @media (max-width: 640px) {
    body { font-size: 18px; }
    .tr nav { gap: 14px; }
    nav a { font-size: 16px; }
    .corner { gap: 14px; }
    .tl, .tr { top: max(18px, env(safe-area-inset-top)); }
    .tl { left: 18px; } .tr { right: 18px; } .bl { left: 18px; bottom: max(26px, env(safe-area-inset-bottom)); } .hero .br { display: none; } footer .br { right: 18px; left: 18px; bottom: max(24px, env(safe-area-inset-bottom)); text-align: left; } footer .bl { bottom: 64px; }
    .name { font-size: 18px; }
    .line { font-size: 24px; }
    .row { flex-wrap: wrap; gap: 2px 12px; }
    .row .d { flex-basis: 100%; order: 3; }
    .row .k { margin-left: auto; }
    #peek { display: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="peek" aria-hidden="true"></canvas>

<div class="layer">
  <header class="hero" id="top">
    <div class="corner tl"><a class="name clear" href="#top">Sahil Mahendrakar</a></div>
    <div class="corner tr"><nav class="corner clear" style="position:static" aria-label="Sections"><a href="#work">Work</a><a href="#writing">Writing</a><a href="#contact">Contact</a></nav></div>
    <div class="corner bl"><p class="line clear" id="line"></p></div>
    <div class="corner br"><button class="caption mono clear" id="caption" title="Show another painting" aria-label="Painting credit. Click for another painting."></button></div>
  </header>

  <main>
    <div class="col">
      <section id="work" aria-labelledby="work-h">
        <h2 class="mono" id="work-h">Work</h2>
        <ol id="work-list"></ol>
      </section>
      <section id="writing" aria-labelledby="writing-h">
        <h2 class="mono" id="writing-h">Writing</h2>
        <ol id="writing-list"></ol>
        <a class="more" id="all-writing" target="_blank" rel="noopener">All writing &rarr;</a>
      </section>
      <section aria-labelledby="papers-h">
        <h2 class="mono" id="papers-h">Papers</h2>
        <ol id="paper-list"></ol>
      </section>
    </div>
  </main>

  <footer id="contact">
    <div class="corner bl clear-wrap"><div class="links clear" id="links"></div></div>
    <div class="corner br"><span class="fine mono clear" id="caption2"></span></div>
  </footer>
</div>

<script src="../content.js"></script>
<script src="../dither.js"></script>
<script src="scene.js"></script>
<script>
(function () {
  'use strict';
  const S = window.SITE, $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- the essentials only ----------
  const SHORT = {
    chickadee: 'reads any web page aloud, on your machine',
    jungle: 'a workspace shared by people and their agents',
    fluxx: 'project management for coding agents',
    ccbeam: 'moves a Claude Code session between machines',
    aristotle: 'an e-reader you can ask questions',
  };
  const work = ['chickadee', 'jungle', 'fluxx', 'ccbeam', 'aristotle'].map((id) => S.projects.find((p) => p.id === id)).filter(Boolean);
  $('#line').innerHTML = 'Building in stealth.<br><em>Previously agentic AI at AWS.</em>';
  work.forEach((p) => {
    const li = document.createElement('li');
    li.innerHTML = `<a class="row" href="${esc(p.links.live || p.links.github)}" target="_blank" rel="noopener" data-img="../${esc(p.image)}"><span class="n">${esc(p.name)}</span><span class="d">${esc(SHORT[p.id] || p.tagline)}</span></a>`;
    $('#work-list').append(li);
  });
  const fmt = (d) => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  const short = (t) => t.replace(/^Serving custom models efficiently with fast cold starts$/, 'Fast cold starts for custom models').replace(/: predictive speech-to-text in 29M parameters$/, ', predictive speech-to-text').replace(/^Paradee 1\.3: The smallest multilingual TTS model$/, 'The smallest multilingual voice model');
  S.writing.slice(0, 3).forEach((w) => {
    const li = document.createElement('li');
    li.innerHTML = `<a class="row" href="https://sahilmahendrakar.com${esc(w.url)}"><span class="n">${esc(short(w.title))}</span><span class="d"></span><span class="k mono">${fmt(w.date)}</span></a>`;
    $('#writing-list').append(li);
  });
  $('#all-writing').href = S.thoughts.url;
  S.publications.filter((p) => p.kind === 'paper').forEach((p) => {
    const li = document.createElement('li');
    li.innerHTML = `<a class="row" href="${esc(p.url)}" target="_blank" rel="noopener"><span class="n">${esc(p.title.split(':')[0])}</span><span class="d">${esc(p.title.split(':')[1].trim().replace(/^./, (c) => c.toLowerCase()))}</span><span class="k mono">${esc(p.year)}</span></a>`;
    $('#paper-list').append(li);
  });
  $('#links').innerHTML = S.contact.filter((c) => c.label !== 'Substack').map((c) => `<a href="${esc(c.href)}"${c.href.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${esc(c.label)}</a>`).join('');

  // ---------- the scene ----------
  const hero = $('.hero'), foot = $('footer');
  const vh = () => window.innerHeight;
  const footP = () => clamp01((vh() - foot.getBoundingClientRect().top) / (vh() * 0.85));
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  const clears = () => [...document.querySelectorAll('.clear')].map((el) => el.getBoundingClientRect()).filter((r) => r.bottom > -40 && r.top < vh() + 40 && r.width).map((r) => ({ x: r.left, y: r.top, w: r.width, h: r.height, pad: 10, feather: 24 }));
  const scene = LiveScene.mount($('#scene'), {
    paperColor: '#f4efe4',
    scroll: () => Math.min(clamp01(scrollY / (vh() * 0.75)), 1 - footP()),
    paperAmount: () => Math.min(clamp01((scrollY - vh() * 0.5) / (vh() * 0.62)), 1 - footP()),
    clear: clears,
    onScene(c) {
      const d = c.def, cap = `<b>${esc(d.title)}</b><br>${esc(d.artist)}, ${esc(d.year)}`;
      $('#caption').innerHTML = cap; $('#caption2').innerHTML = `${esc(d.artist)}, ${esc(d.title)}`;
      document.title = 'Sahil Mahendrakar';
      // the page borrows one colour from the painting
      const P = c.palette, sat = (p) => { const mx = Math.max(...p), mn = Math.min(...p); return (mx - mn) / (mx + 1); };
      const cand = P.filter((p) => { const l = 0.3 * p[0] + 0.59 * p[1] + 0.11 * p[2]; return l > 55 && l < 150; }).sort((a, b) => sat(b) - sat(a))[0] || [138, 90, 60];
      document.documentElement.style.setProperty('--accent', `rgb(${cand.map((v) => Math.round(v * 0.85)).join(',')})`);
      paintPeek.pal = [...P, [244, 239, 228], [27, 24, 20]];
    },
  });
  $('#caption').addEventListener('click', () => scene.next());

  // ---------- hovering a project shows it, dithered in the painting's colours ----------
  const peek = $('#peek'), pctx = peek.getContext('2d');
  function paintPeek(src) {
    D.loadImage(src).then((img) => {
      const w = 72, h = 45; peek.width = w; peek.height = h;
      pctx.putImageData(D.palette(D.sample(img, w, h, { focus: [0.5, 0] }), paintPeek.pal || [[0, 0, 0], [255, 255, 255]], { matrix: 'blue', spread: 40 }), 0, 0);
    }).catch(() => {});
  }
  const D = window.Dither;
  document.querySelectorAll('[data-img]').forEach((a) => {
    a.addEventListener('pointerenter', () => { paintPeek(a.dataset.img); peek.classList.add('on'); });
    a.addEventListener('pointerleave', () => peek.classList.remove('on'));
    a.addEventListener('pointermove', (e) => { peek.style.left = (e.clientX + 26) + 'px'; peek.style.top = (e.clientY - 150) + 'px'; });
  });
})();
</script>
</body>
</html>
